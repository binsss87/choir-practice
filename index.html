<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d8e5df">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="합창 연습실">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<title>꿈꾸지 않으면 · 합창 연습실</title>
<style>
:root{
  --paper:#fbf5e7;--paper2:#f4ead5;--ink:#25313a;--ink2:#64727a;
  --red:#e55c67;--blue:#5e9fc6;--green:#65a987;--yellow:#e7bb56;
  --purple:#9577b8;--pink:#e67d99;--line:#2e3a42;
  --shadow:7px 8px 0 rgba(39,49,56,.14);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#d8e5df;color:var(--ink);
  font-family:"Segoe Print","Comic Sans MS","Noto Sans KR","Malgun Gothic",sans-serif}
body{background-image:
  radial-gradient(circle at 15% 15%,rgba(255,255,255,.65) 0 1px,transparent 1.5px),
  linear-gradient(120deg,#d8e5df,#d5e0eb 48%,#eadfcf);background-size:22px 22px,100% 100%}
button,input,select{font:inherit}button{cursor:pointer}
.app{width:min(1500px,calc(100% - 24px));margin:auto;padding:20px 0 42px}
.topbar{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:13px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:52px;height:52px;display:grid;place-items:center;font-size:26px;background:#fff6d8;border:2px solid var(--ink);
 border-radius:42% 58% 53% 47% / 45% 48% 52% 55%;transform:rotate(-2deg);box-shadow:3px 4px 0 rgba(37,49,58,.16)}
h1{margin:0;font-size:clamp(22px,2.8vw,36px);letter-spacing:-.04em;transform:rotate(-.35deg)}
.brand small{display:block;color:var(--ink2);margin-top:3px;font-size:12px}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sticker{background:#fff2a8;border:2px solid var(--ink);border-radius:11px 18px 12px 16px;padding:8px 11px;font-size:11px;font-weight:900;transform:rotate(1.2deg)}
.rough-btn{border:2px solid var(--ink);background:#fffdf5;color:var(--ink);padding:8px 12px;border-radius:12px 9px 14px 10px;box-shadow:2px 3px 0 rgba(37,49,58,.18)}
.rough-btn:active{transform:translate(2px,2px);box-shadow:none}
.paper{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:19px 14px 22px 15px;box-shadow:var(--shadow)}
.paper:before{content:"";position:absolute;inset:7px;border:1px dashed rgba(37,49,58,.16);border-radius:14px 11px 17px 12px;pointer-events:none}
.tape{position:absolute;z-index:5;width:70px;height:20px;background:rgba(240,218,151,.75);border:1px solid rgba(104,89,52,.16);top:-10px;left:50%;transform:translateX(-50%) rotate(-1.5deg)}

/* 노래/음원 선택 */
.listen-switch{display:flex;justify-content:center;gap:9px;margin:0 auto 15px;position:relative;z-index:4}
.listen-btn{min-width:150px;border:2px solid var(--ink);background:#fffdf5;color:var(--ink2);padding:10px 18px;border-radius:17px 11px 15px 12px;font-weight:900;box-shadow:3px 3px 0 rgba(37,49,58,.13)}
.listen-btn:nth-child(1){transform:rotate(-.5deg)}.listen-btn:nth-child(2){transform:rotate(.5deg)}
.listen-btn.active{background:#bfe7d4;color:#194536;box-shadow:3px 3px 0 rgba(37,49,58,.18),inset 0 -3px rgba(55,127,94,.13)}
.listen-btn .small{display:block;font-size:9px;font-weight:700;opacity:.75;margin-top:2px}

.score-card{padding:16px 17px 18px}
.score-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:9px}
.score-title{display:flex;align-items:baseline;gap:10px}.score-title b{font-size:18px}.score-title span{font-size:11px;color:var(--ink2)}
.tabs{display:flex;gap:7px;flex-wrap:wrap}
.tab{border:2px solid var(--ink);background:#fffdf5;color:var(--ink2);padding:7px 11px;border-radius:16px 11px 17px 12px;font-size:12px;font-weight:900;box-shadow:2px 2px 0 rgba(37,49,58,.12)}
.tab:nth-child(2n){transform:rotate(.7deg)}.tab:nth-child(2n+1){transform:rotate(-.5deg)}
.tab.active{color:#203037;box-shadow:2px 3px 0 rgba(37,49,58,.18)}
.tab[data-part="soprano"].active{background:#f3b3c5}
.tab[data-part="altoHigh"].active{background:#f0cf7b}
.tab[data-part="altoLow"].active{background:#c6afe0}
.tab[data-part="men"].active{background:#9fcbe4}
.tab[data-part="all"].active{background:#bfe7d4;color:#194536}
.score-labels{position:absolute;inset:0;z-index:16;pointer-events:none}
.score-row-label{position:absolute;left:11px;min-width:92px;text-align:center;padding:5px 8px;border:1.5px solid var(--ink);
 border-radius:10px 7px 11px 8px;background:#fffdf5;font-size:12px;font-weight:900;box-shadow:1px 2px 0 rgba(37,49,58,.12)}
.score-row-label.soprano{background:#f8cfda}.score-row-label.altoHigh{background:#f7e2a9}
.score-row-label.altoLow{background:#ded0ee}.score-row-label.men{background:#c5e1f0}
.score-stage{position:relative;height:365px;min-height:285px;overflow:hidden;transition:height .18s ease;background:
 linear-gradient(rgba(83,119,145,.12) 1px,transparent 1px),
 linear-gradient(90deg,rgba(83,119,145,.09) 1px,transparent 1px),#fffdf5;background-size:24px 24px;
 border:2px solid var(--ink);border-radius:14px 19px 13px 17px}
.score-stage:before,.score-stage:after{content:"";position:absolute;top:0;bottom:0;width:14%;z-index:8;pointer-events:none}
.score-stage:before{left:0;background:linear-gradient(90deg,#fffdf5 0,rgba(255,253,245,.9) 42%,transparent)}
.score-stage:after{right:0;background:linear-gradient(270deg,#fffdf5 0,rgba(255,253,245,.9) 42%,transparent)}
.staff-svg{position:absolute;left:0;top:0;width:auto;height:auto;max-width:none;overflow:visible}.score-world{will-change:transform}
.playhead{position:absolute;z-index:12;top:22px;bottom:24px;left:42%;width:3px;background:var(--red);transform:rotate(.3deg);box-shadow:0 0 0 1px rgba(255,255,255,.8)}
.playhead:before{content:"";position:absolute;top:-3px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--red);transform:translateX(-50%)}
.measure-tag{position:absolute;z-index:13;left:42%;top:12px;transform:translateX(-50%) rotate(-1deg);background:#fff2a8;border:2px solid var(--ink);border-radius:9px 12px 9px 12px;padding:5px 9px;font-size:11px;font-weight:900}
.hint{position:absolute;z-index:14;left:14px;bottom:11px;background:rgba(255,253,245,.9);border:1.5px solid var(--ink);border-radius:9px;padding:5px 8px;font-size:10px;color:var(--ink2)}
.sync{position:absolute;z-index:14;right:13px;bottom:10px;display:flex;align-items:center;gap:6px;background:rgba(255,253,245,.92);border:1.5px solid var(--ink);border-radius:12px;padding:5px 7px;font-size:10px;color:var(--ink2)}
.sync input{width:110px;accent-color:var(--red)}

/* 노래방식 큰 가사 */
.lyrics{margin-top:15px;padding:20px 18px;text-align:center;min-height:164px}
.lyrics .label{font-size:10px;letter-spacing:.18em;font-weight:900;color:var(--green)}
.lyric-karaoke{position:relative;display:flex;justify-content:center;align-items:baseline;flex-wrap:wrap;max-width:1180px;margin:10px auto 5px;
 font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:clamp(29px,4.5vw,55px);font-weight:900;line-height:1.34;letter-spacing:-.045em;word-break:keep-all}
.lyric-syllable{display:inline-block;color:var(--ink);transition:color .08s ease,transform .08s ease,text-shadow .08s ease}
.lyric-syllable.sung{color:var(--red)}
.lyric-syllable.current{color:#d83e50;transform:translateY(-2px) scale(1.06);text-shadow:0 3px 0 rgba(229,92,103,.13)}
.lyric-rest{display:inline-block;width:.22em}
.lyric-progress{width:min(680px,80%);height:6px;border:1.5px solid var(--ink);border-radius:999px;margin:9px auto 4px;background:#fffdf5;overflow:hidden;transform:rotate(-.15deg)}
.lyric-progress>i{display:block;height:100%;width:0%;background:var(--red);transition:width .06s linear}
.next-lyric{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;color:#7e8a8f;font-size:clamp(14px,1.6vw,20px);font-weight:700;min-height:1.6em}
.lyric-part-label{display:inline-block;margin-left:7px;padding:2px 7px;border:1px dashed var(--ink);border-radius:999px;color:var(--ink2);font-size:9px;letter-spacing:0;background:#fffdf5;vertical-align:middle}

.main-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(355px,.6fr);gap:15px;margin-top:15px}
.transport,.mixer{padding:17px}
.timebar{display:grid;grid-template-columns:66px 1fr 66px;gap:9px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}.seek{width:100%;accent-color:var(--red)}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;align-items:center;margin-top:13px}
.play{border:2px solid var(--ink);background:#bfe7d4;color:#183e32;padding:12px 22px;min-width:120px;border-radius:15px 11px 17px 12px;font-weight:900;box-shadow:3px 4px 0 rgba(37,49,58,.18)}
.ctrl{border:2px solid var(--ink);background:#fffdf5;color:var(--ink);padding:9px 11px;border-radius:10px 14px 9px 12px;font-size:12px;font-weight:800}.ctrl.active{background:#fff2a8}
.loop-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px}
.ab{border:2px solid var(--ink);background:#f7efd9;border-radius:11px 14px 10px 15px;padding:8px 10px}.ab small{display:block;color:var(--ink2);font-size:9px;font-weight:900}.ab b{font-size:17px}
.sections{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.section-btn{border:1.5px dashed var(--ink);background:#fffdf5;color:var(--ink2);border-radius:11px;padding:6px 9px;font-size:10px;font-weight:800}
.speed{display:flex;gap:6px;align-items:center;font-size:10px;color:var(--ink2)}.speed select{border:1.5px solid var(--ink);background:#fffdf5;border-radius:8px;padding:6px}

.mixer-head{display:flex;justify-content:space-between;align-items:flex-end}.mixer-head b{font-size:17px}.mixer-head span{font-size:10px;color:var(--ink2)}
.mode-note{display:none;font-family:"Malgun Gothic","Noto Sans KR",sans-serif;background:#fff6d8;border:1.5px dashed var(--ink);border-radius:10px;padding:7px 9px;margin-top:9px;font-size:10px;color:var(--ink2)}
.presets{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 0}
.preset,.mr-source{border:1.5px solid var(--ink);background:#fffdf5;color:var(--ink2);border-radius:10px;padding:7px 3px;font-size:9px;font-weight:900;transition:.12s}
.preset.active,.mr-source.active{transform:translateY(-1px);box-shadow:2px 3px 0 rgba(37,49,58,.18);color:white}
.preset[data-preset="full"].active,.mr-source[data-mr="all"].active{background:var(--green)}
.preset[data-preset="soprano"].active,.mr-source[data-mr="soprano"].active{background:var(--pink)}
.preset[data-preset="altoHigh"].active{background:var(--yellow);color:#4b3a10}
.preset[data-preset="altoLow"].active{background:var(--purple)}
.preset[data-preset="men"].active,.mr-source[data-mr="men"].active{background:var(--blue)}
.mr-source[data-mr="alto"].active{background:var(--yellow);color:#4b3a10}
.mr-source[data-mr="backing"].active{background:#728089}
.channel{display:grid;grid-template-columns:92px 42px 1fr 40px;gap:7px;align-items:center;padding:9px 0;border-top:1px dashed rgba(37,49,58,.23)}
.ch-name{font-size:12px;font-weight:900}.ch-name small{display:block;color:var(--ink2);font-size:9px;margin-top:2px}
.mute{height:31px;border:1.5px solid var(--ink);border-radius:9px;font-size:9px;font-weight:900;box-shadow:1px 2px 0 rgba(37,49,58,.10)}
.mute.enabled{background:#a9dfbd;color:#174c32}.mute.muted{background:#f4b8c0;color:#702732}
.vol{width:100%;accent-color:var(--blue)}.volnum{text-align:right;font-size:9px;color:var(--ink2)}
.mr-panel{display:none}.mr-panel.show{display:block}.song-panel.hide{display:none}
.mr-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 0}

.mr-toggle{border:1.5px solid var(--ink);background:#fffdf5;color:var(--ink2);border-radius:10px;padding:7px 3px;font-size:9px;font-weight:900;transition:.12s}
.mr-toggle.active{transform:translateY(-1px);box-shadow:2px 3px 0 rgba(37,49,58,.18);color:white}
.mr-toggle[data-mr-toggle="backing"].active{background:#728089}
.mr-toggle[data-mr-toggle="all"].active{background:var(--green)}
.mr-toggle[data-mr-toggle="soprano"].active{background:var(--pink)}
.mr-toggle[data-mr-toggle="alto"].active{background:var(--yellow);color:#4b3a10}
.mr-toggle[data-mr-toggle="men"].active{background:var(--blue)}

.mr-channel{display:grid;grid-template-columns:92px 42px 1fr 40px;gap:7px;align-items:center;padding:9px 0;border-top:1px dashed rgba(37,49,58,.23)}
.mr-channel:first-child{border-top:0}
.mr-master-note{display:none;font-family:"Malgun Gothic","Noto Sans KR",sans-serif;background:#e8f3ed;border:1.5px dashed var(--ink);border-radius:10px;padding:7px 9px;margin:8px 0 5px;font-size:10px;color:var(--ink2)}
.status{margin-top:9px;font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:11px;color:var(--ink2);text-align:center;min-height:16px}.status.error{color:#a6293a;font-weight:700}
.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(33,44,48,.75);place-items:center;padding:18px}.modal.open{display:grid}
.modal-card{width:min(1100px,100%);max-height:93vh;overflow:auto;background:var(--paper);border:2px solid var(--ink);border-radius:17px;padding:13px}
.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.pages{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pages img{width:100%;border:1.5px solid var(--ink);background:white}
kbd{font:inherit;border:1px solid var(--ink);border-radius:5px;padding:1px 5px;background:white}

@media(max-width:1100px){
  .main-grid{grid-template-columns:1fr}
}
@media(max-width:767px){
  html,body{overscroll-behavior-y:none}
  body{background:#e5eee9}
  button,input,select{touch-action:manipulation}
  .app{
    width:100%;padding:max(8px,env(safe-area-inset-top)) 8px calc(22px + env(safe-area-inset-bottom));
  }
  .topbar{
    position:sticky;top:0;z-index:70;margin:0 -2px 8px;padding:7px 4px;
    background:rgba(229,238,233,.94);backdrop-filter:blur(10px);
    border-bottom:1px dashed rgba(37,49,58,.25)
  }
  .logo{width:40px;height:40px;font-size:20px;box-shadow:2px 2px 0 rgba(37,49,58,.14)}
  h1{font-size:18px;line-height:1.15}
  .rough-btn{font-size:10px;padding:7px 8px;box-shadow:1px 2px 0 rgba(37,49,58,.15)}
  .listen-switch{
    position:sticky;top:55px;z-index:65;margin:0 0 8px;padding:6px 0;
    background:rgba(229,238,233,.94);backdrop-filter:blur(10px)
  }
  .listen-btn{min-width:0;flex:1;padding:10px 7px;font-size:12px}
  .paper{border-width:1.5px;box-shadow:3px 4px 0 rgba(39,49,56,.12)}
  .score-card{padding:10px 8px 10px}
  .tape{display:none}
  .score-head{display:block;margin-bottom:8px}
  .score-title{margin-bottom:7px}.score-title b{font-size:15px}
  .tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;width:100%}
  .tab{transform:none!important;padding:9px 2px;border-width:1.5px;font-size:10px;white-space:nowrap}
  .score-stage{border-width:1.5px;border-radius:11px}
  .playhead,.measure-tag{left:42%!important}
  .measure-tag{top:7px;font-size:10px;padding:4px 7px}
  .score-row-label{left:5px;min-width:72px;font-size:10px;padding:4px 5px}
  .sync{right:5px;bottom:5px;font-size:8px;padding:4px 5px}
  .sync input{width:78px}
  .main-grid{display:flex;flex-direction:column;gap:9px;margin-top:9px}
  .transport{order:1;padding:12px 10px}
  .mixer{order:2;padding:12px 10px}
  .timebar{grid-template-columns:52px 1fr 52px;font-size:10px;gap:6px}
  .seek{height:26px}
  .controls{gap:5px;margin-top:9px}
  .play{min-width:104px;padding:10px 13px;font-size:12px}
  .ctrl{padding:8px 9px;font-size:10px;border-width:1.5px}
  .speed{width:100%;justify-content:center;margin-top:2px}
  .loop-row{grid-template-columns:1fr 1fr;gap:5px;margin-top:9px}
  .loop-row .ctrl{grid-column:1/-1}
  .ab{padding:7px 8px;border-width:1.5px}.ab b{font-size:14px}
  .sections{gap:4px;margin-top:9px}.section-btn{padding:6px 7px;font-size:9px}
  .mixer-head b{font-size:15px}
  .presets{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .preset,.mr-toggle{font-size:8.5px;padding:8px 2px}
  .channel,.mr-channel{grid-template-columns:72px 40px minmax(82px,1fr) 32px;gap:5px;padding:8px 0}
  .ch-name{font-size:10px}.ch-name small{font-size:8px}
  .mute{height:30px;font-size:9px}
  .volnum{font-size:8px}
  .modal{padding:6px}.modal-card{border-radius:12px;padding:8px}.pages{grid-template-columns:1fr}
}
@media(min-width:768px){
  .score-stage{max-height:none}
}

button{pointer-events:auto;-webkit-tap-highlight-color:transparent}
.listen-switch,.tabs,.presets,.controls,.sections,.mixer{pointer-events:auto}


.tab.all-mode-muted{opacity:.42;filter:grayscale(.35);box-shadow:none;background:#f1eee6!important;color:#879097!important}
.tab.all-mode-muted:hover{opacity:.68;transform:translateY(-1px)!important}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">♫</div>
      <div><h1>꿈꾸지 않으면 · 합창 연습실</h1></div>
    </div>
    <div class="top-actions"><button class="rough-btn" id="openScore">원본 악보 보기</button></div>
  </header>

  <div class="listen-switch">
    <button class="listen-btn active" data-mode="song">노래 듣기</button>
    <button class="listen-btn" data-mode="mr">음원 듣기</button>
  </div>

  <section class="paper score-card">
    <div class="tape"></div>
    <div class="score-head">
      <div class="score-title"><b>흐르는 악보</b></div>
      <div class="tabs">
        <button class="tab tab-all active" data-part="all">전체</button>
        <button class="tab active" data-part="soprano">Soprano</button>
        <button class="tab active" data-part="altoHigh">Alto High</button>
        <button class="tab active" data-part="altoLow">Alto Low</button>
        <button class="tab active" data-part="men">Men</button>
      </div>
    </div>
    <div class="score-stage">
      <svg id="staffSvg" class="staff-svg" viewBox="0 0 1400 560" preserveAspectRatio="none"><g id="scoreWorld" class="score-world"></g></svg>
      <div id="scoreLabels" class="score-labels"></div>
      <div class="playhead"></div>
      <div id="measureTag" class="measure-tag">전주</div>
      
      <div class="sync">악보 싱크 <input id="syncOffset" type="range" min="-5" max="5" step=".02" value="0"><b id="syncVal">0.00s</b></div>
    </div>
  </section>

  <div class="main-grid">
    <section class="paper transport">
      <div class="timebar"><span id="curTime">0:00.0</span><input id="seek" class="seek" type="range" min="0" max="100" value="0" step=".01"><span id="duration">0:00.0</span></div>
      <div class="controls">
        <button class="ctrl" id="back5">−5초</button><button class="play" id="playBtn">▶ 재생</button><button class="ctrl" id="fwd5">+5초</button>
        <button class="ctrl" id="phraseLoop">현재 구간 반복</button>
        <div class="speed">속도 <select id="speed"><option value=".75">0.75×</option><option value=".85">0.85×</option><option value=".9">0.90×</option><option value="1" selected>1.00×</option><option value="1.1">1.10×</option></select></div>
      </div>
      <div class="loop-row">
        <div class="ab"><small>A · 반복 시작</small><b id="aTime">--:--.-</b></div><div class="ab"><small>B · 반복 끝</small><b id="bTime">--:--.-</b></div>
        <button class="ctrl" id="loopToggle">🔁 반복 OFF</button>
      </div>
      <div class="controls" style="margin-top:8px">
        <button class="ctrl" id="setA">A 설정</button><button class="ctrl" id="setB">B 설정</button><button class="ctrl" id="goA">A로</button><button class="ctrl" id="clearLoop">초기화</button>
      </div>
      <div class="sections" id="sections"></div>
      <div id="audioStatus" class="status" style="display:none"></div>
    </section>

function spacingBeforeIndexes(raw){

     indexes.add(rawIndex);

 return indexes;
}

function ensureDetailedScore(){

 try{
  const parts={};
  PART_ORDER.forEach(part=>{
   const src=DATA.parts[part]||{};
   const ev=(src.events||src.notes||[]).map(n=>({
    q:+n.q||0,localQ:+n.localQ||0,dur:+n.dur||.5,type:n.type||"",dots:+n.dots||0,
    rest:n.kind==="rest"||!!n.rest,lyric:n.lyric||"",syllabic:n.syllabic||"",
    tieStart:false,tieStop:false,step:n.step,octave:n.octave,alter:+n.alter||0,midi:n.midi
   }));
   const measures=DATA.measureStarts.map((m,i)=>{
    const qStart=m.q, qEnd=i+1<DATA.measureStarts.length?DATA.measureStarts[i+1].q:DATA.totalQ;
    return {index:i,qStart:qStart,qDur:qEnd-qStart,clef:src.clef||"treble",events:ev.filter(e=>e.q>=qStart&&e.q<qEnd)};
   });
   parts[part]={name:PART_LABELS[part],clef:src.clef||"treble",measures:measures,totalQ:DATA.totalQ};
  });

 }catch(e){console.error("score fallback",e);return false}
}

function restPath(type,x,y){

 }
 if(type==="16th"){

   g.appendChild(svgEl("ellipse",{cx:x+4,cy:y-15,rx:4.0,ry:3.1,fill:"#172123",transform:`rotate(18 ${x+4} ${y-15})`}));
   g.appendChild(svgEl("ellipse",{cx:x+1,cy:y-5,rx:4.0,ry:3.1,fill:"#172123",transform:`rotate(18 ${x+1} ${y-5})`}));
   g.appendChild(svgEl("path",{d:`M ${x+7} ${y-13} C ${x+5} ${y-5}, ${x+1} ${y+6}, ${x-4} ${y+19}`,

 }
 // 4분쉼표: 인쇄 악보의 번개형 몸통 + 아래 갈고리
 g.appendChild(svgEl("path",{d:
   `M ${x-2} ${y-19} L ${x+5} ${y-10} L ${x} ${y-4} L ${x+6} ${y+3} `+
   `L ${x+1} ${y+7} C ${x+7} ${y+9}, ${x+6} ${y+17}, ${x+1} ${y+19} `+

function noteVisualType(ev){

 if(ev.dur>=4) return "whole";
 if(ev.dur>=2) return "half";
 if(ev.dur>=1) return "quarter";
 if(ev.dur>=0.5) return "eighth";

}

function drawAccidental(g,alter,y){
 const els=[],x=-19;
 if(alter>0){
   // ♯ : 두 세로선 + 두 사선
   const parts=[
     svgEl("line",{x1:x-3,x2:x-1.5,y1:y-12,y2:y+11,stroke:"#172123","stroke-width":1.7,"stroke-linecap":"round"}),
     svgEl("line",{x1:x+4,x2:x+5.5,y1:y-13,y2:y+10,stroke:"#172123","stroke-width":1.7,"stroke-linecap":"round"}),
     svgEl("line",{x1:x-7,x2:x+9,y1:y-4,x2:x+9,y2:y-6,stroke:"#172123","stroke-width":2.1,"stroke-linecap":"round"}),
     svgEl("line",{x1:x-7,x2:x+9,y1:y+4,x2:x+9,y2:y+2,stroke:"#172123","stroke-width":2.1,"stroke-linecap":"round"})
   ];
   // x1/y1 for the two horizontal-ish strokes need explicit correction
   parts[2].setAttribute("x1",x-7); parts[2].setAttribute("y1",y-2.5); parts[2].setAttribute("x2",x+9); parts[2].setAttribute("y2",y-5.0);
   parts[3].setAttribute("x1",x-7); parts[3].setAttribute("y1",y+5.0); parts[3].setAttribute("x2",x+9); parts[3].setAttribute("y2",y+2.5);
   parts.forEach(el=>{g.appendChild(el);els.push(el)});
 }else if(alter<0){
   // ♭ : 긴 세로선 + 아래쪽 둥근 고리
   const stem=svgEl("line",{x1:x-2,x2:x-2,y1:y-14,y2:y+11,stroke:"#172123","stroke-width":1.8,"stroke-linecap":"round"});
   const bowl=svgEl("path",{d:`M ${x-2} ${y-1} C ${x+7} ${y-7}, ${x+10} ${y+1}, ${x+4} ${y+6} C ${x+1} ${y+8}, ${x-1} ${y+9}, ${x-2} ${y+10}`,
     fill:"none",stroke:"#172123","stroke-width":1.9,"stroke-linecap":"round","stroke-linejoin":"round"});
   g.appendChild(stem);g.appendChild(bowl);els.push(stem,bowl);
 }
 return els;
}
function createNoteGroup(ev,clef,y0,mobile){
 const x=ev.q*PXQ, y=noteYForRow(ev,clef,y0), g=svgEl("g",{"data-q":ev.q,"data-dur":ev.dur,transform:"translate("+x+",0)"});
 drawLedgerForRow(g,y,y0);
 const refs={q:ev.q,dur:ev.dur,filled:false,els:[],lyric:null};
 if(ev.alter){
   drawAccidental(g,ev.alter,y).forEach(el=>refs.els.push(el));
 }
 const vtype=noteVisualType(ev), filled=isFilledType(vtype);
 refs.filled=filled;
 const head=svgEl("ellipse",{cx:0,cy:y,rx:7,ry:4.9,fill:filled?"#172123":"#fffdf5",stroke:"#172123","stroke-width":1.8,transform:"rotate(-18 0 "+y+")"});
 g.appendChild(head); refs.head=head; refs.els.push(head);
 if(vtype!=="whole"){
   const stemUp=y>y0+67, sx=stemUp?6:-6, sy1=y, sy2=stemUp?y-28:y+28;
   const stem=svgEl("line",{x1:sx,x2:sx,y1:sy1,y2:sy2,stroke:"#172123","stroke-width":1.8});
   g.appendChild(stem); refs.els.push(stem);
   if(vtype==="eighth"||vtype==="16th"){
     const d1=stemUp?(`M ${sx} ${sy2} q 13 6 7 18`):(`M ${sx} ${sy2} q -13 -6 -7 -18`);
     const f1=svgEl("path",{d:d1,fill:"none",stroke:"#172123","stroke-width":1.8,"stroke-linecap":"round"});
     g.appendChild(f1); refs.els.push(f1);
     if(vtype==="16th"){
       const sy3=stemUp?sy2+7:sy2-7;
       const d2=stemUp?(`M ${sx} ${sy3} q 13 6 7 18`):(`M ${sx} ${sy3} q -13 -6 -7 -18`);
       const f2=svgEl("path",{d:d2,fill:"none",stroke:"#172123","stroke-width":1.6,"stroke-linecap":"round"});
       g.appendChild(f2); refs.els.push(f2);
     }
   }
 }
 if(ev.dots) drawDot(g,0,y,ev.dots);
 let lyricEl=null;
 if(ev.lyric){
   lyricEl=svgEl("text",{x:0,y:y0+142,fill:"#263234","font-size":mobile?16.5:17,"font-weight":800,"text-anchor":"middle","font-family":"Malgun Gothic, sans-serif"});
   lyricEl.textContent=ev.lyric;
   g.appendChild(lyricEl);
   refs.lyric=lyricEl;
 }
 return {group:g,refs:refs, y:y};
}

     }
   }
 });

 world.appendChild(clefText);
 const ties=[];
 pdata.measures.forEach((m)=>{
   m.events.forEach((ev,ei)=>{
     const x=ev.q*PXQ;
     if(ev.rest){
       const centerY=y0+67;
       const rest=restPath(noteVisualType(ev),x,centerY);
       world.appendChild(rest);

     }
     if(ev.tieStop){
       for(let k=ties.length-1;k>=0;k--){
         if(ties[k].midi===ev.midi){
           drawTie(world, ties[k].x+8, x-8, built.y+9, built.y<y0+67);
           ties.splice(k,1);
           break;
         }
       }
     }
   });
 });
 const label=document.createElement("div");
 label.className="score-row-label "+part;
 label.textContent=PART_LABELS[part];
 label.style.top=(y0+49)+"px";

 });

}

   let ai=-1;
   for(let i=0;i<arr.length;i++){
     if(arr[i].q<=q && q<arr[i].q+Math.max(arr[i].dur,.18)){ ai=i; break; }
   }
   const oldIndex=lastActive[part]??-1;
   if(ai!==oldIndex){
     if(oldIndex>=0 && arr[oldIndex]) paintActive(arr[oldIndex], false);
     if(ai>=0 && arr[ai]) paintActive(arr[ai], true);
     lastActive[part]=ai;
   }
 });
}
function lyricWindowIndex(q){
 let idx=0;
 for(let i=0;i<LYRIC_WINDOWS.length;i++){
   if(q>=LYRIC_WINDOWS[i][0])idx=i;
   if(q<LYRIC_WINDOWS[i][1])break;
 }
 return idx;
}
function lyricEvents(part,windowIndex){
 const r=LYRIC_WINDOWS[windowIndex],notes=DATA.parts[part].notes;
 return notes.filter(n=>n.lyric&&n.q>=r[0]&&n.q<r[1]);
}
function lyricPlainText(part,windowIndex){
 const r=LYRIC_WINDOWS[windowIndex];
 if(r[0]===0||r[0]===136)return "♪ 간주 ♪";
 const ev=lyricEvents(part,windowIndex);
 const raw=ev.map(x=>x.lyric).join("");
 return ev.length?formattedLyricText(raw):"♪";
}
function renderLyricLine(){ }
function updateLyrics(){ }
function updateAll(){
 const t=globalTime(),d=modeDuration();document.getElementById("curTime").textContent=fmt(t);document.getElementById("duration").textContent=fmt(d);
 document.getElementById("seek").value=d?t/d*100:0;updateScorePosition();
}
function pauseEverything(){Object.values(songAudios).forEach(a=>a.pause());Object.values(mrAudios).forEach(a=>a.pause())}
function setGlobalTime(t){
 t=clamp(t,0,modeDuration());
 if(mode==="song"){Object.values(songAudios).forEach(a=>{try{a.currentTime=t}catch(e){}})}
 else{Object.entries(mrAudios).forEach(([id,a])=>{const at=clamp(t+MR_OFFSETS[id],0,isFinite(a.duration)?a.duration:9999);try{a.currentTime=at}catch(e){}})}
 updateAll();
}
function prepareAudio(){
 if(audioUnlocked)return;[...Object.values(songAudios),...Object.values(mrAudios)].forEach(a=>{a.preload="auto";a.playsInline=true;try{a.load()}catch(e){}});audioUnlocked=true;
}
async function playCurrent(){
 prepareAudio();const rate=+document.getElementById("speed").value;pauseEverything();const promises=[];
 if(mode==="song"){
   const t=globalTime();Object.values(songAudios).forEach(a=>{a.playbackRate=rate;if(Math.abs((a.currentTime||0)-t)>.08)try{a.currentTime=t}catch(e){};try{const p=a.play();if(p&&p.then)promises.push(p)}catch(e){}})
 }else{
   const t=globalTime();
   Object.entries(mrAudios).forEach(([id,a])=>{
     a.playbackRate=rate;
     const target=clamp(t+MR_OFFSETS[id],0,isFinite(a.duration)?a.duration:9999);
     if(Math.abs((a.currentTime||0)-target)>.08)try{a.currentTime=target}catch(e){}
     try{const p=a.play();if(p&&p.then)promises.push(p)}catch(e){}
   });
 }
 const r=await Promise.allSettled(promises),ok=r.some(x=>x.status==="fulfilled");
 if(ok||promises.length===0){playing=true;document.getElementById("playBtn").textContent="❚❚ 일시정지";setStatus(mode==="song"?"노래 듣기 · 재생 중":"음원 듣기 · MR 믹스 재생 중",false)}
 else{playing=false;document.getElementById("playBtn").textContent="▶ 재생";setStatus("재생이 차단되었습니다. ZIP을 압축 해제한 뒤 Chrome/Edge에서 다시 실행해 주세요.",true)}
}
function pauseCurrent(){pauseEverything();playing=false;document.getElementById("playBtn").textContent="▶ 재생";setStatus("일시정지",false)}
function toggle(){playing?pauseCurrent():playCurrent()}
function syncSongTracks(){if(!playing||mode!=="song")return;const t=songAudios.full.currentTime;SONG_TRACKS.slice(1).forEach(x=>{const a=songAudios[x.id];if(Math.abs((a.currentTime||0)-t)>.09)try{a.currentTime=t}catch(e){}})}
function syncMrTracks(){
 if(!playing||mode!=="mr")return;
 const t=mrAudios.backing.currentTime||0;
 Object.entries(mrAudios).forEach(([id,a])=>{
   if(id==="backing")return;
   const target=t+MR_OFFSETS[id];
   if(Math.abs((a.currentTime||0)-target)>.09)try{a.currentTime=target}catch(e){}
 });
}
function tick(){if(playing){const t=globalTime();if(loopOn&&A!==null&&B!==null&&t>=B-.025)setGlobalTime(A);updateAll()}requestAnimationFrame(tick)}



function addScoreParts(parts,focus){
 parts.forEach(p=>selectedScoreParts.add(p));
 if(focus&&selectedScoreParts.has(focus))scorePart=focus;
 updateScoreTabs();renderScore();
}
function removeScoreParts(parts){
 parts.forEach(p=>{
   if(selectedScoreParts.size>1)selectedScoreParts.delete(p);
 });
 ensureFocusPart();updateScoreTabs();renderScore();
}
function scorePartsForMr(id){
 if(id==="soprano")return ["soprano"];
 if(id==="alto")return ["altoHigh","altoLow"];
 if(id==="men")return ["men"];
 if(id==="all")return PART_ORDER.slice();
 return [];
}
function refreshSongQuick(id){
 const btn=document.querySelector('.preset[data-preset="'+id+'"]');
 if(btn)btn.classList.toggle("active",!songAudios[id].muted);
}
function refreshAllSongQuicks(){SONG_TRACKS.forEach(t=>refreshSongQuick(t.id))}
function refreshSongUi(){
 SONG_TRACKS.forEach(t=>{
   const mb=document.getElementById("m-"+t.id);
   if(mb)refreshMuteButton(mb,songAudios[t.id].muted);
   refreshSongQuick(t.id);
 });
}
function refreshMrUi(){
 MR_TRACKS.forEach(t=>{
   const mb=document.getElementById("mm-"+t.id);
   if(mb)refreshMuteButton(mb,mrAudios[t.id].muted);
   refreshMrToggle(t.id);
 });
}
function setScoreParts(parts,focus){
 if(parts.length===0)return;
 selectedScoreParts=new Set(parts);
 if(focus&&selectedScoreParts.has(focus))scorePart=focus;
 else if(!selectedScoreParts.has(scorePart))scorePart=parts[0];
 updateScoreTabs();renderScore();
}
function activeSongParts(){
 if(!songAudios.full.muted)return PART_ORDER.slice();
 return PART_ORDER.filter(p=>!songAudios[p].muted);
}
function activeMrParts(){
 if(!mrAudios.all.muted)return PART_ORDER.slice();
 const parts=[];
 if(!mrAudios.soprano.muted)parts.push("soprano");
 if(!mrAudios.alto.muted)parts.push("altoHigh","altoLow");
 if(!mrAudios.men.muted)parts.push("men");
 return parts;
}
function syncScoreFromSongAudio(){
 const parts=activeSongParts();
 if(parts.length)setScoreParts(parts,parts.includes(scorePart)?scorePart:parts[0]);
}
function syncScoreFromMrAudio(){
 const parts=activeMrParts();
 if(parts.length)setScoreParts(parts,parts.includes(scorePart)?scorePart:parts[0]);
}
function syncSongAudioFromScore(useFull){
 const allSelected=selectedScoreParts.size===PART_ORDER.length;
 if(useFull&&allSelected){
   songAudios.full.muted=false;
   PART_ORDER.forEach(p=>songAudios[p].muted=true);
 }else{
   songAudios.full.muted=true;
   PART_ORDER.forEach(p=>songAudios[p].muted=!selectedScoreParts.has(p));
 }
 refreshSongUi();
}
function syncMrAudioFromScore(useAll){
 const allSelected=selectedScoreParts.size===PART_ORDER.length;
 if(useAll&&allSelected){
   mrAudios.all.muted=false;
   mrAudios.soprano.muted=true;
   mrAudios.alto.muted=true;
   mrAudios.men.muted=true;
 }else{
   mrAudios.all.muted=true;
   mrAudios.soprano.muted=!selectedScoreParts.has("soprano");
   mrAudios.alto.muted=!(selectedScoreParts.has("altoHigh")||selectedScoreParts.has("altoLow"));
   mrAudios.men.muted=!selectedScoreParts.has("men");
 }
 // backing은 악보와 무관하므로 유지
 refreshMrUi();
}
function selectAllScoreParts(){
 selectedScoreParts=new Set(PART_ORDER);
 scorePart="soprano";
 if(mode==="song"){
   songAudios.full.muted=false;
   PART_ORDER.forEach(p=>songAudios[p].muted=true);
   refreshSongUi();
 }else{
   mrAudios.all.muted=false;
   mrAudios.soprano.muted=true;
   mrAudios.alto.muted=true;
   mrAudios.men.muted=true;
   refreshMrUi();
   updateMrStatus();
 }
 updateScoreTabs();
 renderScore();
}
function toggleScorePart(part){
 // '전체'가 켜진 상태에서 개별 파트를 누르면 그 파트만 단독 선택한다.
 // 기존처럼 '전체에서 그 파트만 빠지는' 동작을 하지 않는다.
 if(isLowerAllActive()){
   selectedScoreParts=new Set([part]);
   scorePart=part;
   if(mode==="song")syncSongAudioFromScore(false);
   else syncMrAudioFromScore(false);
   updateScoreTabs();
   renderScore();
   return;
 }

 const currently=selectedScoreParts.has(part);
 if(currently&&selectedScoreParts.size===1){
   scorePart=part;
   updateScoreTabs();
   return;
 }
 if(currently)selectedScoreParts.delete(part);
 else{selectedScoreParts.add(part);scorePart=part}

 ensureFocusPart();
 if(mode==="song")syncSongAudioFromScore(false);
 else syncMrAudioFromScore(false);
 updateScoreTabs();
 renderScore();
}
function buildSongMixer(){
 const box=document.getElementById("channels");
 SONG_TRACKS.forEach((t,i)=>{
   const row=document.createElement("div");row.className="channel";
   row.innerHTML='<div class="ch-name" style="color:'+t.color+'">'+t.name+'<small>'+t.sub+'</small></div><button class="mute" id="m-'+t.id+'">ON</button><input class="vol" id="v-'+t.id+'" type="range" min="0" max="100" value="'+(i===0?85:100)+'"><div class="volnum" id="n-'+t.id+'">'+(i===0?85:100)+'%</div>';
   box.appendChild(row);const a=songAudios[t.id],mb=row.querySelector(".mute"),v=row.querySelector(".vol"),n=row.querySelector(".volnum");
   a.volume=+v.value/100;a.muted=i!==0;refreshMuteButton(mb,a.muted);
   mb.addEventListener("click",()=>toggleSongTrack(t.id));
   v.addEventListener("input",()=>{a.volume=+v.value/100;n.textContent=v.value+"%"});
 });
}
function refreshMuteButton(btn,muted){btn.classList.toggle("muted",muted);btn.classList.toggle("enabled",!muted);btn.textContent=muted?"M":"ON"}


function clearPresetHighlight(){refreshAllSongQuicks()}
function toggleSongTrack(id){
 if(id==="full"){
   const turnOn=songAudios.full.muted;
   if(turnOn){
     songAudios.full.muted=false;
     PART_ORDER.forEach(p=>songAudios[p].muted=true);
     selectedScoreParts=new Set(PART_ORDER);
     scorePart="soprano";
   }else{
     songAudios.full.muted=true;
   }
 }else{
   if(!songAudios.full.muted) songAudios.full.muted=true;
   songAudios[id].muted=!songAudios[id].muted;
   const parts=activeSongParts();
   if(parts.length){
     selectedScoreParts=new Set(parts);
     scorePart=parts.includes(id)?id:(selectedScoreParts.has(scorePart)?scorePart:parts[0]);
   }
 }
 refreshSongUi();
 updateScoreTabs();
 renderScore();
}
function toggleSongQuick(id){toggleSongTrack(id)}

 SONG_TRACKS.forEach(t=>songAudios[t.id].muted=true);
 if(id==="full"){
   songAudios.full.muted=false;
   selectedScoreParts=new Set(PART_ORDER);
   scorePart="soprano";
 }else{
   songAudios[id].muted=false;
   selectedScoreParts=new Set([id]);
   scorePart=id;
 }
 updateScoreTabs();refreshSongUi();renderScore();
}
const MR_TRACKS=[
 {id:"backing",name:"반주",sub:"Backing",color:"#728089"},
 {id:"all",name:"전체",sub:"All",color:"#65a987"},

}

     mrAudios.all.muted=true;
   }

function toggleMrFromButton(id){toggleMrTrack(id)}

function switchMode(newMode){
 if(newMode===mode)return;
 const q=currentQ(),wasPlaying=playing;
 pauseEverything();mode=newMode;playing=false;

 document.querySelectorAll(".listen-btn").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
 document.getElementById("songPanel").classList.toggle("hide",mode!=="song");
 document.getElementById("mrPanel").classList.toggle("show",mode==="mr");
 document.getElementById("mixerModeLabel").textContent=mode==="song"?"노래 듣기":"음원 듣기";

 const allSelected=selectedScoreParts.size===PART_ORDER.length;
 if(mode==="song")syncSongAudioFromScore(allSelected);
 else syncMrAudioFromScore(allSelected);

 setGlobalTime(qToTime(q));
 document.getElementById("playBtn").textContent="▶ 재생";
 if(mode==="mr")updateMrStatus();
 updateScoreTabs();
 if(wasPlaying)playCurrent();
}
function loopDisplay(){document.getElementById("aTime").textContent=A==null?"--:--.-":fmt(A);document.getElementById("bTime").textContent=B==null?"--:--.-":fmt(B);const b=document.getElementById("loopToggle");b.classList.toggle("active",loopOn);b.textContent=loopOn?"🔁 반복 ON":"🔁 반복 OFF"}

function init(){
 const scoreReady=!!(DATA&&DATA.parts)&&ensureDetailedScore();
 buildSongMixer();buildMrMixer();
 if(scoreReady){applySongPreset("full");updateScoreTabs();renderScore();refreshMrUi();}
 else{refreshAllSongQuicks();setStatus("악보 데이터를 불러오지 못했습니다.",true);}
 document.querySelectorAll(".listen-btn").forEach(b=>b.addEventListener("click",()=>switchMode(b.dataset.mode)));
 document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
   if(!scoreReady)return;
   b.dataset.part==="all"?selectAllScoreParts():toggleScorePart(b.dataset.part);
 }));
 document.querySelectorAll(".preset").forEach(b=>b.addEventListener("click",()=>toggleSongQuick(b.dataset.preset)));
 document.querySelectorAll(".mr-toggle").forEach(b=>b.addEventListener("click",()=>toggleMrFromButton(b.dataset.mrToggle)));
   [...Object.values(songAudios),...Object.values(mrAudios)].forEach(a=>a.addEventListener("error",()=>setStatus("오디오 파일을 찾지 못했습니다. ZIP을 완전히 압축 해제해 주세요.",true)));
 document.getElementById("playBtn").addEventListener("click",toggle);
 document.getElementById("back5").addEventListener("click",()=>setGlobalTime(globalTime()-5));document.getElementById("fwd5").addEventListener("click",()=>setGlobalTime(globalTime()+5));
 document.getElementById("seek").addEventListener("input",e=>setGlobalTime(modeDuration()*e.target.value/100));
 document.getElementById("speed").addEventListener("change",e=>{[...Object.values(songAudios),...Object.values(mrAudios)].forEach(a=>a.playbackRate=+e.target.value)});
 document.getElementById("syncOffset").addEventListener("input",e=>{syncOffset=+e.target.value;document.getElementById("syncVal").textContent=(syncOffset>=0?"+":"")+syncOffset.toFixed(2)+"s";updateAll()});
 document.getElementById("setA").addEventListener("click",()=>{A=globalTime();if(B!==null&&B<=A)B=null;loopDisplay()});
 document.getElementById("setB").addEventListener("click",()=>{B=globalTime();if(A===null)A=Math.max(0,B-10);if(B<=A)B=Math.min(modeDuration(),A+1);loopDisplay()});
 document.getElementById("goA").addEventListener("click",()=>{if(A!==null)setGlobalTime(A)});
 document.getElementById("loopToggle").addEventListener("click",()=>{if(A===null)A=globalTime();if(B===null)B=Math.min(modeDuration(),A+10);loopOn=!loopOn;loopDisplay()});
 document.getElementById("clearLoop").addEventListener("click",()=>{A=B=null;loopOn=false;loopDisplay()});
 document.getElementById("phraseLoop").addEventListener("click",()=>{
   if(!scoreReady)return;
   const wi=lyricWindowIndex(currentQ()),r=LYRIC_WINDOWS[wi];
   A=qToTime(r[0]);B=qToTime(r[1]);loopOn=true;setGlobalTime(A);loopDisplay();
 });
 const sbox=document.getElementById("sections");sections.forEach(([q,l])=>{const b=document.createElement("button");b.className="section-btn";b.textContent=l;b.addEventListener("click",()=>setGlobalTime(q===0?0:qToTime(q)));sbox.appendChild(b)});
 document.addEventListener("keydown",e=>{if(e.target.matches("input,select,button"))return;if(e.code==="Space"){e.preventDefault();toggle()}});
 document.getElementById("openScore").addEventListener("click",()=>document.getElementById("scoreModal").classList.add("open"));document.getElementById("closeScore").addEventListener("click",()=>document.getElementById("scoreModal").classList.remove("open"));
 document.getElementById("scoreModal").addEventListener("click",e=>{if(e.target.id==="scoreModal")e.currentTarget.classList.remove("open")});
 let resizeTimer=null;
 window.addEventListener("resize",()=>{if(!scoreReady)return;clearTimeout(resizeTimer);resizeTimer=setTimeout(renderScore,120)});
 setInterval(()=>{syncSongTracks();syncMrTracks()},300);loopDisplay();updateAll();tick();
}
init();
